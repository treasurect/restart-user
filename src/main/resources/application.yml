server:
  port: 8081

spring:
  application:
    name: restart-user

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/restart_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: treasure
    password: ${DB_PWD}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH}
  public-key-path: ${JWT_PUBLIC_KEY_PATH}